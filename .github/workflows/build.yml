name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "pluginmaster.json"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build Lisan/Lisan.csproj -c Release -p:Platform=x64

      - name: Worker self-test (no model needed)
        shell: pwsh
        run: python -I -c "import ast,sys; ast.parse(open('Lisan/Models/translate_worker.py',encoding='utf-8').read()); print('worker parses')"

      - uses: actions/upload-artifact@v4
        with:
          name: Lisan-${{ github.sha }}
          path: |
            Lisan/bin/x64/Release/Lisan/latest.zip
            Lisan/bin/x64/Release/Lisan/Lisan.json
